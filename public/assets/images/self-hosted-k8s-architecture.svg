<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="400" y="35" text-anchor="middle" font-size="20" class="dg-heading">Self-Hosted Architecture</text>
  <g>
    <rect x="645" y="410" width="100" height="40" rx="8" class="dg-node" />
    <text x="695" y="435" text-anchor="middle" font-size="11" class="dg-title">GitHub/GitLab</text>
  </g>
  <path d="M 695 410 L 695 371" stroke-dasharray="4" marker-end="url(#arrow)" class="dg-edge" />
  <g>
    <rect x="20" y="200" width="80" height="60" rx="8" class="dg-node" />
    <text x="60" y="235" text-anchor="middle" font-size="13" class="dg-title">User</text>
  </g>
  <path d="M 100 230 L 155 230" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <text x="125" y="220" text-anchor="middle" font-size="10" class="dg-label">HTTPS</text>
  <g>
    <rect x="160" y="200" width="100" height="60" rx="8" class="dg-node" />
    <text x="210" y="225" text-anchor="middle" font-size="12" class="dg-title">Cloudflare</text>
    <text x="210" y="243" text-anchor="middle" font-size="10" class="dg-sub">CDN + DNS</text>
  </g>
  <rect x="320" y="70" width="460" height="330" rx="8" class="dg-group" />
  <text x="550" y="95" text-anchor="middle" font-size="14" class="dg-glabel">K3s Cluster</text>
  <path d="M 260 230 L 345 175" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <g>
    <rect x="340" y="145" width="100" height="50" rx="8" class="dg-node" />
    <text x="390" y="175" text-anchor="middle" font-size="12" class="dg-title">Ingress</text>
  </g>
  <path d="M 390 195 L 390 216" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <g>
    <rect x="340" y="220" width="100" height="60" rx="8" class="dg-node dg-node--accent" />
    <text x="390" y="245" text-anchor="middle" font-size="12" class="dg-title dg-title--accent">Blog Site</text>
    <text x="390" y="263" text-anchor="middle" font-size="10" class="dg-sub">Bun.js</text>
  </g>
  <path d="M 440 240 L 645 240" stroke-dasharray="4,4" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 390 280 L 390 311" marker-end="url(#arrow)" class="dg-edge" />
  <g>
    <rect x="340" y="315" width="100" height="50" rx="8" class="dg-node" />
    <text x="390" y="345" text-anchor="middle" font-size="12" class="dg-title">Postgres</text>
  </g>
  <path d="M 440 250 L 485 250" marker-end="url(#arrow)" class="dg-edge" />
  <g>
    <rect x="490" y="220" width="100" height="60" rx="8" class="dg-node" />
    <text x="540" y="245" text-anchor="middle" font-size="12" class="dg-title">Ollama</text>
    <text x="540" y="263" text-anchor="middle" font-size="10" class="dg-sub">Llama 3</text>
  </g>
  <g>
    <rect x="640" y="210" width="110" height="60" rx="8" class="dg-node" />
    <text x="695" y="235" text-anchor="middle" font-size="11" class="dg-title">Prometheus</text>
    <text x="695" y="253" text-anchor="middle" font-size="11" class="dg-sub">Grafana</text>
  </g>
  <g>
    <rect x="640" y="315" width="110" height="50" rx="8" class="dg-node" />
    <text x="695" y="345" text-anchor="middle" font-size="12" class="dg-title">FluxCD</text>
  </g>
  <path d="M 640 340 L 600 340 L 600 170 L 445 170" stroke-dasharray="4" marker-end="url(#arrow)" class="dg-edge" />
  <text x="400" y="470" text-anchor="middle" font-size="11" class="dg-label">Homelab • GitOps Workflow • Persistent Storage</text>
