<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="400" y="30" text-anchor="middle" font-size="18" class="dg-heading">Automated Deployment Pipeline</text>
  <g>
    <rect x="50" y="100" width="100" height="60" rx="8" class="dg-node" />
    <text x="100" y="125" text-anchor="middle" font-size="12" class="dg-title">Git Push</text>
    <text x="100" y="143" text-anchor="middle" font-size="10" class="dg-sub">main branch</text>
  </g>
  <path d="M 150 130 L 210 130" marker-end="url(#arrow)" class="dg-edge" />
  <text x="180" y="120" text-anchor="middle" font-size="9" class="dg-label">trigger</text>
  <g>
    <rect x="210" y="100" width="100" height="60" rx="8" class="dg-node" />
    <text x="260" y="120" text-anchor="middle" font-size="11" class="dg-title">GitHub</text>
    <text x="260" y="135" text-anchor="middle" font-size="11" class="dg-title">Actions</text>
    <text x="260" y="150" text-anchor="middle" font-size="9" class="dg-sub">Build Image</text>
  </g>
  <path d="M 310 130 L 370 130" marker-end="url(#arrow)" class="dg-edge" />
  <text x="340" y="120" text-anchor="middle" font-size="9" class="dg-label">push</text>
  <g>
    <rect x="370" y="100" width="100" height="60" rx="8" class="dg-node" />
    <text x="420" y="125" text-anchor="middle" font-size="11" class="dg-title">Container</text>
    <text x="420" y="143" text-anchor="middle" font-size="11" class="dg-title">Registry</text>
  </g>
  <path d="M 470 130 L 530 130" marker-end="url(#arrow)" class="dg-edge" />
  <text x="500" y="120" text-anchor="middle" font-size="9" class="dg-label">detect</text>
  <g>
    <rect x="530" y="100" width="100" height="60" rx="8" class="dg-node dg-node--accent" />
    <text x="580" y="125" text-anchor="middle" font-size="12" class="dg-title dg-title--accent">FluxCD</text>
    <text x="580" y="143" text-anchor="middle" font-size="10" class="dg-sub">Reconcile</text>
  </g>
  <path d="M 630 130 L 690 130" marker-end="url(#arrow)" class="dg-edge" />
  <text x="660" y="120" text-anchor="middle" font-size="9" class="dg-label">deploy</text>
  <g>
    <rect x="690" y="100" width="90" height="60" rx="8" class="dg-node" />
    <text x="735" y="120" text-anchor="middle" font-size="12" class="dg-title">K3s</text>
    <text x="735" y="135" text-anchor="middle" font-size="10" class="dg-sub">Cluster</text>
    <text x="735" y="150" text-anchor="middle" font-size="9" class="dg-sub">Update Pods</text>
  </g>
  <text x="400" y="210" text-anchor="middle" font-size="11" class="dg-label">Total time: ~2-3 minutes from commit to production</text>
  <text x="400" y="230" text-anchor="middle" font-size="10" class="dg-label">Zero manual intervention • Fully automated • GitOps driven</text>
</svg>
