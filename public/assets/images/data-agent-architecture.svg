<svg viewBox="0 0 950 620" width="950" height="620" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gemmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="qwenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="safetyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="sseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c084fc"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="620" rx="16" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
  </pattern>
  <rect width="950" height="620" fill="url(#grid)"/>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Dual-Model Agent Architecture</text>
  <text x="475" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Gemma3 12B (Intent + Formatting) + Qwen3 8B (Tool Calling) + Read-Only Safety Layer</text>

  <!-- ========== USER ========== -->
  <g filter="url(#shadow)">
    <rect x="30" y="130" width="110" height="100" rx="12" fill="url(#userGrad)"/>
    <!-- Browser icon -->
    <rect x="50" y="145" width="50" height="35" rx="4" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="53" y="148" width="44" height="4" rx="1" fill="#7c3aed"/>
    <circle cx="57" cy="150" r="1.5" fill="#ef4444"/>
    <circle cx="63" cy="150" r="1.5" fill="#fbbf24"/>
    <circle cx="69" cy="150" r="1.5" fill="#22c55e"/>
    <rect x="53" y="155" width="44" height="22" rx="2" fill="#3b0764"/>
    <text x="75" y="186" text-anchor="middle" fill="#e9d5ff" font-size="7">Chat UI</text>
    <text x="85" y="205" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">User</text>
    <text x="85" y="220" text-anchor="middle" fill="#c4b5fd" font-size="8">Natural Language</text>
  </g>

  <!-- ========== CHAT APP ========== -->
  <g filter="url(#shadow)">
    <rect x="195" y="100" width="155" height="155" rx="12" fill="url(#chatGrad)"/>
    <!-- Bun icon -->
    <g transform="translate(215, 112)">
      <ellipse cx="12" cy="10" rx="10" ry="7" fill="#fbf0df"/>
      <ellipse cx="12" cy="8" rx="8" ry="5" fill="#f5e6d3"/>
      <text x="12" y="12" text-anchor="middle" fill="#000" font-size="6" font-weight="bold">BUN</text>
    </g>
    <text x="260" y="123" fill="#ffffff" font-size="11" font-weight="600">Chat App</text>
    <text x="260" y="136" fill="#bfdbfe" font-size="8">Bun / Hono</text>

    <rect x="207" y="145" width="131" height="98" rx="6" fill="#1e3a8a" opacity="0.6"/>
    <text x="220" y="163" fill="#93c5fd" font-size="9" font-weight="500">Orchestrator:</text>
    <text x="220" y="179" fill="#93c5fd" font-size="8">Route to Gemma3</text>
    <text x="220" y="193" fill="#93c5fd" font-size="8">Parse intent tags</text>
    <text x="220" y="207" fill="#93c5fd" font-size="8">Dispatch to Qwen3</text>
    <text x="220" y="221" fill="#93c5fd" font-size="8">SSE streaming</text>
    <text x="220" y="235" fill="#93c5fd" font-size="8">SQL retry on error</text>
  </g>

  <!-- ========== GEMMA3 ========== -->
  <g filter="url(#shadow)">
    <rect x="405" y="75" width="175" height="120" rx="12" fill="url(#gemmaGrad)"/>
    <!-- Llama icon -->
    <g transform="translate(420, 83)">
      <ellipse cx="15" cy="18" rx="12" ry="10" fill="#fef3c7"/>
      <ellipse cx="15" cy="8" rx="8" ry="7" fill="#fef3c7"/>
      <ellipse cx="10" cy="5" rx="2" ry="4" fill="#fef3c7"/>
      <ellipse cx="20" cy="5" rx="2" ry="4" fill="#fef3c7"/>
      <circle cx="12" cy="8" r="1.5" fill="#78350f"/>
      <circle cx="18" cy="8" r="1.5" fill="#78350f"/>
    </g>
    <text x="475" y="98" fill="#ffffff" font-size="12" font-weight="700">Gemma3 12B</text>
    <text x="475" y="112" fill="#fef3c7" font-size="8">Conversational Model</text>

    <rect x="417" y="120" width="151" height="65" rx="6" fill="#78350f" opacity="0.5"/>
    <text x="430" y="137" fill="#fde68a" font-size="9" font-weight="500">Responsibilities:</text>
    <text x="430" y="153" fill="#fde68a" font-size="8">Understand user intent</text>
    <text x="430" y="167" fill="#fbbf24" font-size="8" font-weight="600">Emit &lt;intent&gt; or respond</text>
    <text x="430" y="181" fill="#fde68a" font-size="8">Format results as markdown</text>
  </g>

  <!-- ========== QWEN3 ========== -->
  <g filter="url(#shadow)">
    <rect x="405" y="220" width="175" height="120" rx="12" fill="url(#qwenGrad)"/>
    <!-- Code icon -->
    <g transform="translate(420, 228)">
      <rect width="24" height="18" rx="3" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1"/>
      <text x="12" y="13" text-anchor="middle" fill="#5b21b6" font-size="8" font-weight="bold">{}</text>
    </g>
    <text x="475" y="243" fill="#ffffff" font-size="12" font-weight="700">Qwen3 8B</text>
    <text x="475" y="257" fill="#e9d5ff" font-size="8">Tool Calling Specialist</text>

    <rect x="417" y="265" width="151" height="65" rx="6" fill="#3b0764" opacity="0.5"/>
    <text x="430" y="282" fill="#d8b4fe" font-size="9" font-weight="500">Responsibilities:</text>
    <text x="430" y="298" fill="#d8b4fe" font-size="8">Generate SQL queries</text>
    <text x="430" y="312" fill="#c084fc" font-size="8" font-weight="600">Native Ollama tool calling</text>
    <text x="430" y="326" fill="#d8b4fe" font-size="8">Schema-aware, precise</text>
  </g>

  <!-- ========== SAFETY LAYER ========== -->
  <g filter="url(#shadow)">
    <rect x="640" y="210" width="150" height="145" rx="12" fill="url(#safetyGrad)"/>
    <!-- Shield icon -->
    <g transform="translate(690, 218)">
      <path d="M 15 0 L 30 8 L 30 20 C 30 28 22 34 15 36 C 8 34 0 28 0 20 L 0 8 Z" fill="#fca5a5" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M 10 18 L 14 22 L 22 13" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <text x="715" y="262" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Safety Layer</text>

    <rect x="652" y="272" width="126" height="75" rx="6" fill="#7f1d1d" opacity="0.6"/>
    <text x="665" y="290" fill="#fca5a5" font-size="8" font-weight="600">Read-only DB user</text>
    <text x="665" y="305" fill="#fca5a5" font-size="8" font-weight="600">SQL validation</text>
    <text x="672" y="318" fill="#fecaca" font-size="7">SELECT/WITH only</text>
    <text x="672" y="330" fill="#fecaca" font-size="7">Block DROP/ALTER/DELETE</text>
    <text x="665" y="345" fill="#fca5a5" font-size="8" font-weight="600">5s timeout + LIMIT 100</text>
  </g>

  <!-- ========== BLOG DB ========== -->
  <g filter="url(#shadow)">
    <rect x="640" y="390" width="140" height="95" rx="10" fill="url(#dbGrad)"/>
    <g transform="translate(655, 398)">
      <ellipse cx="12" cy="5" rx="10" ry="4" fill="#a7f3d0" stroke="#059669"/>
      <rect x="2" y="5" width="20" height="14" fill="#a7f3d0" stroke="none"/>
      <ellipse cx="12" cy="19" rx="10" ry="4" fill="#a7f3d0" stroke="#059669"/>
      <line x1="2" y1="5" x2="2" y2="19" stroke="#059669"/>
      <line x1="22" y1="5" x2="22" y2="19" stroke="#059669"/>
    </g>
    <text x="695" y="418" fill="#ffffff" font-size="10" font-weight="600">Blog DB</text>
    <text x="695" y="431" fill="#a7f3d0" font-size="8">PostgreSQL</text>
    <text x="655" y="450" fill="#6ee7b7" font-size="8">comments</text>
    <text x="655" y="463" fill="#6ee7b7" font-size="8">likes</text>
    <text x="655" y="476" fill="#6ee7b7" font-size="8">comment_summaries</text>
  </g>

  <!-- ========== OPERATIONAL DB ========== -->
  <g filter="url(#shadow)">
    <rect x="800" y="390" width="140" height="95" rx="10" fill="url(#dbGrad)"/>
    <g transform="translate(815, 398)">
      <ellipse cx="12" cy="5" rx="10" ry="4" fill="#a7f3d0" stroke="#059669"/>
      <rect x="2" y="5" width="20" height="14" fill="#a7f3d0" stroke="none"/>
      <ellipse cx="12" cy="19" rx="10" ry="4" fill="#a7f3d0" stroke="#059669"/>
      <line x1="2" y1="5" x2="2" y2="19" stroke="#059669"/>
      <line x1="22" y1="5" x2="22" y2="19" stroke="#059669"/>
    </g>
    <text x="855" y="418" fill="#ffffff" font-size="10" font-weight="600">Operational DB</text>
    <text x="855" y="431" fill="#a7f3d0" font-size="8">TimescaleDB</text>
    <text x="815" y="450" fill="#6ee7b7" font-size="8">metrics</text>
    <text x="815" y="463" fill="#6ee7b7" font-size="8">snapshots</text>
    <text x="815" y="476" fill="#6ee7b7" font-size="8">performance data</text>
  </g>

  <!-- ========== ARROWS ========== -->

  <!-- 1. User to Chat App -->
  <path d="M 140 180 L 185 180" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="162" y="173" text-anchor="middle" fill="#a78bfa" font-size="7">question</text>

  <!-- 2. Chat App to Gemma3 (intent check) -->
  <path d="M 350 150 L 395 135" stroke="#fbbf24" stroke-width="2" fill="none" marker-end="url(#arrowYellow)"/>
  <text x="372" y="132" text-anchor="middle" fill="#fbbf24" font-size="7">prompt</text>

  <!-- 3. Gemma3 intent back to Chat App -->
  <path d="M 405 175 L 350 185" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="375" y="190" text-anchor="middle" fill="#fde68a" font-size="7">&lt;intent&gt;</text>

  <!-- 4. Chat App to Qwen3 (tool call request) -->
  <path d="M 350 230 L 395 260" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="360" y="253" text-anchor="middle" fill="#c084fc" font-size="7">intent +</text>
  <text x="360" y="263" text-anchor="middle" fill="#c084fc" font-size="7">schema</text>

  <!-- 5. Qwen3 to Safety (SQL) -->
  <path d="M 580 290 L 630 290" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="605" y="283" text-anchor="middle" fill="#f87171" font-size="7">SQL</text>

  <!-- 6. Safety to Blog DB -->
  <path d="M 715 355 L 715 385" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- 7. Safety to Operational DB -->
  <path d="M 750 355 L 870 385" stroke="#34d399" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="790" y="365" text-anchor="middle" fill="#34d399" font-size="7">validated query</text>

  <!-- 8. DB results back to Chat App (curved) -->
  <path d="M 640 450 L 275 450 L 275 265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGray)"/>
  <text x="450" y="443" text-anchor="middle" fill="#94a3b8" font-size="7">results</text>

  <!-- 9. Chat App sends results to Gemma3 for formatting -->
  <path d="M 350 160 L 405 145" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="395" y="163" fill="#22d3ee" font-size="6">results</text>

  <!-- 10. Gemma3 formatted answer back -->
  <path d="M 405 105 L 310 100 L 310 100" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="355" y="95" text-anchor="middle" fill="#22d3ee" font-size="7">formatted answer</text>

  <!-- 11. Chat App SSE back to User -->
  <path d="M 195 200 L 140 200" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="167" y="213" text-anchor="middle" fill="#22d3ee" font-size="7">SSE stream</text>

  <!-- ========== FLOW NUMBERS ========== -->
  <g font-size="9" font-weight="700">
    <circle cx="162" cy="180" r="8" fill="#8b5cf6"/>
    <text x="162" y="183" text-anchor="middle" fill="#ffffff" font-size="8">1</text>

    <circle cx="372" cy="140" r="8" fill="#f59e0b"/>
    <text x="372" y="143" text-anchor="middle" fill="#ffffff" font-size="8">2</text>

    <circle cx="375" cy="180" r="8" fill="#f59e0b"/>
    <text x="375" y="183" text-anchor="middle" fill="#ffffff" font-size="8">3</text>

    <circle cx="372" cy="248" r="8" fill="#a855f7"/>
    <text x="372" y="251" text-anchor="middle" fill="#ffffff" font-size="8">4</text>

    <circle cx="605" cy="290" r="8" fill="#ef4444"/>
    <text x="605" y="293" text-anchor="middle" fill="#ffffff" font-size="8">5</text>

    <circle cx="450" cy="450" r="8" fill="#10b981"/>
    <text x="450" y="453" text-anchor="middle" fill="#ffffff" font-size="8">6</text>

    <circle cx="355" cy="103" r="8" fill="#06b6d4"/>
    <text x="355" y="106" text-anchor="middle" fill="#ffffff" font-size="8">7</text>

    <circle cx="167" cy="200" r="8" fill="#06b6d4"/>
    <text x="167" y="203" text-anchor="middle" fill="#ffffff" font-size="8">8</text>
  </g>

  <!-- ========== MODEL LABELS ========== -->
  <!-- Gemma3 label -->
  <rect x="405" y="60" width="80" height="16" rx="4" fill="#fbbf24" opacity="0.2"/>
  <text x="445" y="72" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">INTENT MODEL</text>

  <!-- Qwen3 label -->
  <rect x="405" y="205" width="75" height="16" rx="4" fill="#c084fc" opacity="0.2"/>
  <text x="442" y="217" text-anchor="middle" fill="#c084fc" font-size="8" font-weight="600">TOOL MODEL</text>

  <!-- ========== FLOW DESCRIPTION ========== -->
  <rect x="30" y="510" width="890" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="475" y="533" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Dual-Model Request Flow</text>

  <g font-size="9" fill="#94a3b8">
    <circle cx="55" cy="555" r="7" fill="#8b5cf6"/>
    <text x="55" y="558" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">1</text>
    <text x="68" y="558" fill="#cbd5e1" font-size="8">User asks question</text>

    <circle cx="200" cy="555" r="7" fill="#f59e0b"/>
    <text x="200" y="558" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">2</text>
    <text x="213" y="558" fill="#fde68a" font-size="8">Gemma3 detects intent</text>

    <circle cx="365" cy="555" r="7" fill="#a855f7"/>
    <text x="365" y="558" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">4</text>
    <text x="378" y="558" fill="#d8b4fe" font-size="8">Qwen3 generates SQL</text>

    <circle cx="530" cy="555" r="7" fill="#ef4444"/>
    <text x="530" y="558" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">5</text>
    <text x="543" y="558" fill="#cbd5e1" font-size="8">Validate + execute</text>

    <circle cx="55" cy="580" r="7" fill="#10b981"/>
    <text x="55" y="583" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">6</text>
    <text x="68" y="583" fill="#cbd5e1" font-size="8">Results returned</text>

    <circle cx="200" cy="580" r="7" fill="#06b6d4"/>
    <text x="200" y="583" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">7</text>
    <text x="213" y="583" fill="#fde68a" font-size="8">Gemma3 formats answer</text>

    <circle cx="365" cy="580" r="7" fill="#06b6d4"/>
    <text x="365" y="583" text-anchor="middle" fill="#fff" font-size="7" font-weight="700">8</text>
    <text x="378" y="583" fill="#cbd5e1" font-size="8">SSE stream to user</text>

    <!-- Separator -->
    <line x1="640" y1="545" x2="640" y2="590" stroke="#334155" stroke-width="1"/>

    <!-- Key highlights -->
    <text x="660" y="558" fill="#fbbf24" font-size="8" font-weight="600">Gemma3 = conversation</text>
    <text x="660" y="573" fill="#c084fc" font-size="8" font-weight="600">Qwen3 = tool calling</text>
    <text x="660" y="588" fill="#34d399" font-size="8" font-weight="600">100% local, zero API cost</text>
  </g>
</svg>