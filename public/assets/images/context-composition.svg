<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="400" y="35" text-anchor="middle" font-size="18" class="dg-heading">Context Composition</text>
  <text x="400" y="55" text-anchor="middle" font-size="11" class="dg-label">Data Integration Flow</text>
  <g>
    <rect x="50" y="100" width="180" height="130" rx="8" class="dg-node" />
    <text x="140" y="130" text-anchor="middle" font-size="14" class="dg-title">Recent Window</text>
    <text x="140" y="150" text-anchor="middle" font-size="10" class="dg-sub">(Immediate Context)</text>
    <text x="75" y="180" font-size="10" class="dg-sub">• Full message text</text>
    <text x="75" y="197" font-size="10" class="dg-sub">• User intent</text>
    <text x="75" y="214" font-size="10" class="dg-sub">• Current Task</text>
  </g>
  <g>
    <rect x="310" y="100" width="180" height="130" rx="8" class="dg-node" />
    <text x="400" y="130" text-anchor="middle" font-size="14" class="dg-title">Summary Snapshot</text>
    <text x="400" y="150" text-anchor="middle" font-size="10" class="dg-sub">(Long-term Memory)</text>
    <text x="335" y="180" font-size="10" class="dg-sub">• Key facts</text>
    <text x="335" y="197" font-size="10" class="dg-sub">• Decisions made</text>
    <text x="335" y="214" font-size="10" class="dg-sub">• User preferences</text>
  </g>
  <g>
    <rect x="570" y="100" width="180" height="130" rx="8" class="dg-node" />
    <text x="660" y="130" text-anchor="middle" font-size="14" class="dg-title">System Instructions</text>
    <text x="660" y="150" text-anchor="middle" font-size="10" class="dg-sub">(Behavioral Rules)</text>
    <text x="595" y="180" font-size="10" class="dg-sub">• Persona / Tone</text>
    <text x="595" y="197" font-size="10" class="dg-sub">• Safety guardrails</text>
    <text x="595" y="214" font-size="10" class="dg-sub">• Output format</text>
  </g>
  <g>
    <rect x="230" y="295" width="340" height="110" rx="8" class="dg-node dg-node--accent" />
    <text x="400" y="335" text-anchor="middle" font-size="16" class="dg-title dg-title--accent">Final Context Payload</text>
    <text x="400" y="355" text-anchor="middle" font-size="11" class="dg-sub">(Sent to LLM for processing)</text>
    <text x="285" y="380" font-size="10" class="dg-sub">✓ Continuity preserved • Tokens minimized</text>
  </g>
  <path d="M 140 230 C 140 280, 260 250, 260 295" class="dg-edge" />
  <circle r="4" class="dg-dot">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 140 230 C 140 280, 260 250, 260 295" />
  </circle>
  <path d="M 400 230 L 400 295" class="dg-edge" />
  <circle r="4" class="dg-dot">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 400 230 L 400 295" />
  </circle>
  <path d="M 660 230 C 660 280, 540 250, 540 295" class="dg-edge" />
  <circle r="4" class="dg-dot">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 660 230 C 660 280, 540 250, 540 295" />
  </circle>
  <g transform="translate(40, 310)">
    <rect width="130" height="60" rx="8" class="dg-node" />
    <text x="65" y="25" text-anchor="middle" font-size="11" class="dg-title">Efficiency</text>
    <text x="65" y="45" text-anchor="middle" font-size="10" class="dg-sub">Combined Input</text>
  </g>
</svg>
