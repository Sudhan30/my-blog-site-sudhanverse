<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="500" y="35" text-anchor="middle" font-size="20" class="dg-heading">Email System Architecture Flow</text>
  <g>
    <rect x="50" y="80" width="130" height="70" rx="8" class="dg-node" />
    <text x="115" y="105" text-anchor="middle" font-size="12" class="dg-title">1. Form</text>
    <text x="115" y="122" text-anchor="middle" font-size="12" class="dg-title">Submission</text>
    <text x="115" y="140" text-anchor="middle" font-size="9" class="dg-sub">Contact/Feedback</text>
  </g>
  <g>
    <rect x="220" y="80" width="130" height="70" rx="8" class="dg-node dg-node--accent" />
    <text x="285" y="105" text-anchor="middle" font-size="12" class="dg-title dg-title--accent">2. Cloud</text>
    <text x="285" y="122" text-anchor="middle" font-size="12" class="dg-title dg-title--accent">Function</text>
    <text x="285" y="140" text-anchor="middle" font-size="9" class="dg-sub">Logic &amp; Validation</text>
  </g>
  <g>
    <rect x="220" y="200" width="130" height="70" rx="8" class="dg-node" />
    <text x="285" y="225" text-anchor="middle" font-size="12" class="dg-title">3. Secret</text>
    <text x="285" y="242" text-anchor="middle" font-size="12" class="dg-title">Manager</text>
  </g>
  <g>
    <rect x="390" y="80" width="130" height="70" rx="8" class="dg-node" />
    <text x="455" y="105" text-anchor="middle" font-size="12" class="dg-title">4. Firestore</text>
    <text x="455" y="122" text-anchor="middle" font-size="12" class="dg-title">Database</text>
    <text x="455" y="140" text-anchor="middle" font-size="9" class="dg-sub">Persistent Logs</text>
  </g>
  <g>
    <rect x="560" y="200" width="130" height="70" rx="8" class="dg-node" />
    <text x="625" y="225" text-anchor="middle" font-size="12" class="dg-title">5. SMTP</text>
    <text x="625" y="242" text-anchor="middle" font-size="12" class="dg-title">Service</text>
    <text x="625" y="260" text-anchor="middle" font-size="9" class="dg-sub">Email Delivery</text>
  </g>
  <g>
    <rect x="730" y="200" width="130" height="70" rx="8" class="dg-node" />
    <text x="795" y="230" text-anchor="middle" font-size="12" class="dg-title">6. Final</text>
    <text x="795" y="247" text-anchor="middle" font-size="12" class="dg-title">Recipients</text>
  </g>
  <path d="M 180 115 L 220 115" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <text x="200" y="105" text-anchor="middle" font-size="9" class="dg-label">POST</text>
  <path d="M 275 150 L 275 200" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 295 200 L 295 150" stroke-dasharray="3,3" marker-end="url(#arrow)" class="dg-edge" />
  <text x="325" y="175" text-anchor="middle" font-size="8" class="dg-label">Keys</text>
  <path d="M 350 115 L 390 115" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <text x="370" y="105" text-anchor="middle" font-size="9" class="dg-label">Log</text>
  <path d="M 350 235 L 560 235" marker-end="url(#arrow)" class="dg-edge" />
  <text x="450" y="225" text-anchor="middle" font-size="9" class="dg-label">Trigger Mail</text>
  <path d="M 690 235 L 730 235" marker-end="url(#arrow)" class="dg-edge" />
  <text x="710" y="225" text-anchor="middle" font-size="9" class="dg-label">SMTP</text>
  <rect x="50" y="300" width="280" height="65" rx="8" class="dg-group" />
  <text x="190" y="320" text-anchor="middle" font-size="11" class="dg-glabel">Email Configuration</text>
  <text x="65" y="337" font-size="9" class="dg-sub">• HTML templates with dynamic data</text>
  <text x="65" y="352" font-size="9" class="dg-sub">• Primary + CC + BCC support</text>
  <rect x="350" y="300" width="280" height="65" rx="8" class="dg-group" />
  <text x="490" y="320" text-anchor="middle" font-size="11" class="dg-glabel">Security Layer</text>
  <text x="365" y="337" font-size="9" class="dg-sub">• API keys stored in Secret Manager</text>
  <text x="365" y="352" font-size="9" class="dg-sub">• IAM roles for least-privilege access</text>
  <rect x="650" y="300" width="300" height="65" rx="8" class="dg-group" />
  <text x="800" y="320" text-anchor="middle" font-size="11" class="dg-glabel">Traffic Control</text>
  <text x="665" y="337" font-size="9" class="dg-sub">• Rate Limiting (reCAPTCHA v3)</text>
  <text x="665" y="352" font-size="9" class="dg-sub">• IP-based submission throttling</text>
  <text x="500" y="388" text-anchor="middle" font-size="10" class="dg-label">Cloud-Native Serverless Pipeline • Built for Scale</text>
</svg>
