<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="600" y="35" text-anchor="middle" font-size="22" class="dg-heading">Monitoring Stack Architecture</text>
  <text x="100" y="90" font-size="13" class="dg-glabel">Data Sources</text>
  <g>
    <rect x="50" y="110" width="130" height="60" rx="8" class="dg-node" />
    <text x="115" y="135" text-anchor="middle" font-size="11" class="dg-title">Blog Pods</text>
    <text x="115" y="153" text-anchor="middle" font-size="9" class="dg-sub">/metrics endpoint</text>
  </g>
  <g>
    <rect x="50" y="190" width="130" height="60" rx="8" class="dg-node" />
    <text x="115" y="215" text-anchor="middle" font-size="11" class="dg-title">PostgreSQL</text>
    <text x="115" y="233" text-anchor="middle" font-size="9" class="dg-sub">DB metrics</text>
  </g>
  <g>
    <rect x="50" y="270" width="130" height="60" rx="8" class="dg-node" />
    <text x="115" y="295" text-anchor="middle" font-size="11" class="dg-title">Traefik</text>
    <text x="115" y="313" text-anchor="middle" font-size="9" class="dg-sub">Ingress metrics</text>
  </g>
  <text x="100" y="370" font-size="13" class="dg-glabel">Log Collection</text>
  <g>
    <rect x="50" y="390" width="130" height="60" rx="8" class="dg-node" />
    <text x="115" y="415" text-anchor="middle" font-size="11" class="dg-title">Promtail</text>
    <text x="115" y="433" text-anchor="middle" font-size="9" class="dg-sub">DaemonSet</text>
  </g>
  <text x="350" y="90" font-size="13" class="dg-glabel">Metrics Collection</text>
  <g>
    <rect x="250" y="110" width="160" height="90" rx="8" class="dg-node dg-node--accent" />
    <text x="330" y="140" text-anchor="middle" font-size="12" class="dg-title dg-title--accent">Prometheus</text>
    <text x="330" y="160" text-anchor="middle" font-size="9" class="dg-sub">Scrape: 30s interval</text>
    <text x="330" y="175" text-anchor="middle" font-size="9" class="dg-sub">Retention: 15 days</text>
    <text x="330" y="190" text-anchor="middle" font-size="9" class="dg-sub">Storage: 20GB PVC</text>
  </g>
  <g>
    <rect x="250" y="220" width="160" height="70" rx="8" class="dg-node" />
    <text x="330" y="245" text-anchor="middle" font-size="11" class="dg-title">Blackbox</text>
    <text x="330" y="260" text-anchor="middle" font-size="11" class="dg-title">Exporter</text>
    <text x="330" y="278" text-anchor="middle" font-size="9" class="dg-sub">HTTP probes</text>
  </g>
  <text x="350" y="330" font-size="13" class="dg-glabel">Log Storage</text>
  <g>
    <rect x="250" y="350" width="160" height="90" rx="8" class="dg-node" />
    <text x="330" y="380" text-anchor="middle" font-size="12" class="dg-title">Loki</text>
    <text x="330" y="400" text-anchor="middle" font-size="9" class="dg-sub">Log aggregation</text>
    <text x="330" y="415" text-anchor="middle" font-size="9" class="dg-sub">Retention: 7 days</text>
    <text x="330" y="430" text-anchor="middle" font-size="9" class="dg-sub">Storage: 15GB PVC</text>
  </g>
  <text x="550" y="90" font-size="13" class="dg-glabel">Alerting</text>
  <g>
    <rect x="470" y="110" width="180" height="90" rx="8" class="dg-node" />
    <text x="560" y="140" text-anchor="middle" font-size="12" class="dg-title">Alertmanager</text>
    <text x="560" y="160" text-anchor="middle" font-size="9" class="dg-sub">Email notifications</text>
    <text x="560" y="175" text-anchor="middle" font-size="9" class="dg-sub">Alert grouping</text>
    <text x="560" y="190" text-anchor="middle" font-size="9" class="dg-sub">Deduplication</text>
  </g>
  <text x="800" y="90" font-size="13" class="dg-glabel">Visualization</text>
  <g>
    <rect x="700" y="110" width="200" height="120" rx="8" class="dg-node" />
    <text x="800" y="145" text-anchor="middle" font-size="13" class="dg-title">Grafana</text>
    <text x="800" y="165" text-anchor="middle" font-size="9" class="dg-sub">Metrics dashboards</text>
    <text x="800" y="180" text-anchor="middle" font-size="9" class="dg-sub">Log exploration</text>
    <text x="800" y="195" text-anchor="middle" font-size="9" class="dg-sub">Alert visualization</text>
    <text x="800" y="210" text-anchor="middle" font-size="9" class="dg-sub">Port: 3000</text>
  </g>
  <text x="990" y="90" font-size="13" class="dg-glabel">Persistent Storage</text>
  <g>
    <rect x="940" y="110" width="220" height="70" rx="8" class="dg-node" />
    <text x="1050" y="135" text-anchor="middle" font-size="12" class="dg-title">Local Path Provisioner</text>
    <text x="1050" y="153" text-anchor="middle" font-size="9" class="dg-sub">/var/lib/rancher/k3s/storage</text>
    <text x="1050" y="168" text-anchor="middle" font-size="9" class="dg-sub">Dynamic PV provisioning</text>
  </g>
  <path d="M 180 140 L 250 140" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <path d="M 180 220 L 250 220" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <path d="M 180 300 L 200 300 L 200 260 L 250 260" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 180 420 L 250 395" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 410 155 L 470 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 410 140 L 650 140 L 650 170 L 700 170" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 410 395 L 650 395 L 650 190 L 700 190" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 650 155 L 680 155 L 680 200 L 700 200" stroke-dasharray="3,3" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 900 145 L 940 145" stroke-dasharray="3,3" marker-end="url(#arrow)" class="dg-edge" />
  <text x="215" y="130" text-anchor="middle" font-size="8" class="dg-label">scrape</text>
  <text x="215" y="210" text-anchor="middle" font-size="8" class="dg-label">scrape</text>
  <text x="215" y="250" text-anchor="middle" font-size="8" class="dg-label">scrape</text>
  <text x="215" y="410" text-anchor="middle" font-size="8" class="dg-label">push</text>
  <text x="440" y="145" text-anchor="middle" font-size="8" class="dg-label">alert</text>
  <text x="650" y="130" text-anchor="middle" font-size="8" class="dg-sub">query</text>
  <text x="580" y="385" text-anchor="middle" font-size="8" class="dg-label">query</text>
  <text x="920" y="135" text-anchor="middle" font-size="8" class="dg-label">PVC</text>
  <rect x="50" y="500" width="280" height="160" rx="8" class="dg-group" />
  <text x="190" y="525" text-anchor="middle" font-size="12" class="dg-glabel">Prometheus Metrics</text>
  <text x="60" y="545" font-size="9" class="dg-sub">• CPU, Memory, Disk usage</text>
  <text x="60" y="560" font-size="9" class="dg-sub">• HTTP request rates &amp; latency</text>
  <text x="60" y="575" font-size="9" class="dg-sub">• Database connection pool</text>
  <text x="60" y="590" font-size="9" class="dg-sub">• Pod restart counts</text>
  <text x="60" y="605" font-size="9" class="dg-sub">• Traefik ingress traffic</text>
  <text x="60" y="620" font-size="9" class="dg-sub">• Container resource limits</text>
  <text x="60" y="635" font-size="9" class="dg-sub">• Node exporter system metrics</text>
  <text x="60" y="650" font-size="9" class="dg-sub">• Custom application metrics</text>
  <rect x="360" y="500" width="280" height="160" rx="8" class="dg-group" />
  <text x="500" y="525" text-anchor="middle" font-size="12" class="dg-glabel">Loki Log Labels</text>
  <text x="370" y="545" font-size="9" class="dg-sub">• app: blog, postgres, ollama</text>
  <text x="370" y="560" font-size="9" class="dg-sub">• namespace: web, monitoring</text>
  <text x="370" y="575" font-size="9" class="dg-sub">• pod: unique pod names</text>
  <text x="370" y="590" font-size="9" class="dg-sub">• container: container names</text>
  <text x="370" y="605" font-size="9" class="dg-sub">• node: mini-pc hostname</text>
  <text x="370" y="620" font-size="9" class="dg-sub">• level: error, warn, info, debug</text>
  <text x="370" y="635" font-size="9" class="dg-sub">• job: promtail scrape job</text>
  <text x="370" y="650" font-size="9" class="dg-sub">• LogQL queries for analysis</text>
  <rect x="670" y="500" width="280" height="160" rx="8" class="dg-group" />
  <text x="810" y="525" text-anchor="middle" font-size="12" class="dg-glabel">Alert Rules</text>
  <text x="680" y="545" font-size="9" class="dg-sub">• High CPU usage (&gt;80% for 5min)</text>
  <text x="680" y="560" font-size="9" class="dg-sub">• High memory usage (&gt;90%)</text>
  <text x="680" y="575" font-size="9" class="dg-sub">• Pod restart loops (&gt;3 in 10min)</text>
  <text x="680" y="590" font-size="9" class="dg-sub">• HTTP 5xx errors (&gt;10/min)</text>
  <text x="680" y="605" font-size="9" class="dg-sub">• Disk space low (&lt;10% free)</text>
  <text x="680" y="620" font-size="9" class="dg-sub">• Service endpoint down</text>
  <text x="680" y="635" font-size="9" class="dg-sub">• Database connection failures</text>
  <text x="680" y="650" font-size="9" class="dg-sub">• GPU temperature &gt;85°C</text>
  <rect x="980" y="500" width="180" height="160" rx="8" class="dg-group" />
  <text x="1070" y="525" text-anchor="middle" font-size="12" class="dg-glabel">Dashboards</text>
  <text x="990" y="545" font-size="9" class="dg-sub">• Cluster Overview</text>
  <text x="990" y="560" font-size="9" class="dg-sub">• Node Metrics</text>
  <text x="990" y="575" font-size="9" class="dg-sub">• Pod Resources</text>
  <text x="990" y="590" font-size="9" class="dg-sub">• Blog Performance</text>
  <text x="990" y="605" font-size="9" class="dg-sub">• PostgreSQL Stats</text>
  <text x="990" y="620" font-size="9" class="dg-sub">• Traefik Traffic</text>
  <text x="990" y="635" font-size="9" class="dg-sub">• GPU Utilization</text>
  <text x="990" y="650" font-size="9" class="dg-sub">• Log Stream View</text>
</svg>
