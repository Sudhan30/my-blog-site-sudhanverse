<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="500" y="35" text-anchor="middle" font-size="20" class="dg-heading">Automated Deployment Pipeline</text>
  <g>
    <rect x="50" y="120" width="120" height="70" rx="8" class="dg-node" />
    <text x="110" y="145" text-anchor="middle" font-size="13" class="dg-title">1. Git Push</text>
    <text x="110" y="165" text-anchor="middle" font-size="10" class="dg-sub">to main</text>
  </g>
  <g>
    <rect x="210" y="120" width="140" height="70" rx="8" class="dg-node" />
    <text x="280" y="145" text-anchor="middle" font-size="13" class="dg-title">2. GitHub</text>
    <text x="280" y="162" text-anchor="middle" font-size="13" class="dg-title">Actions</text>
  </g>
  <g>
    <rect x="390" y="120" width="130" height="70" rx="8" class="dg-node" />
    <text x="455" y="145" text-anchor="middle" font-size="13" class="dg-title">3. React</text>
    <text x="455" y="162" text-anchor="middle" font-size="13" class="dg-title">Build</text>
  </g>
  <g>
    <rect x="560" y="120" width="140" height="70" rx="8" class="dg-node dg-node--accent" />
    <text x="630" y="145" text-anchor="middle" font-size="13" class="dg-title dg-title--accent">4. Firebase</text>
    <text x="630" y="162" text-anchor="middle" font-size="13" class="dg-title dg-title--accent">Deploy</text>
  </g>
  <g>
    <rect x="740" y="120" width="140" height="70" rx="8" class="dg-node" />
    <text x="810" y="145" text-anchor="middle" font-size="13" class="dg-title">5. Global</text>
    <text x="810" y="162" text-anchor="middle" font-size="13" class="dg-title">CDN</text>
  </g>
  <path d="M 170 155 L 210 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 350 155 L 390 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 520 155 L 560 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 700 155 L 740 155" marker-end="url(#arrow)" class="dg-edge" />
  <text x="190" y="145" text-anchor="middle" font-size="10" class="dg-label">trigger</text>
  <text x="370" y="145" text-anchor="middle" font-size="10" class="dg-label">build</text>
  <text x="540" y="145" text-anchor="middle" font-size="10" class="dg-label">deploy</text>
  <text x="720" y="145" text-anchor="middle" font-size="10" class="dg-label">distribute</text>
  <rect x="50" y="230" width="420" height="90" rx="8" class="dg-group" />
  <text x="260" y="255" text-anchor="middle" font-size="13" class="dg-glabel">Build Steps</text>
  <text x="60" y="275" font-size="10" class="dg-sub">1. Checkout code from repository</text>
  <text x="60" y="292" font-size="10" class="dg-sub">2. Install dependencies: <tspan class="dg-code">npm ci</tspan>
  </text>
  <text x="60" y="309" font-size="10" class="dg-sub">3. Build production bundle: <tspan class="dg-code">npm run build</tspan>
  </text>
  <rect x="500" y="230" width="410" height="90" rx="8" class="dg-group" />
  <text x="705" y="255" text-anchor="middle" font-size="13" class="dg-glabel">Deployment Features</text>
  <text x="510" y="275" font-size="10" class="dg-sub">• Automatic HTTPS with SSL certificates</text>
  <text x="510" y="292" font-size="10" class="dg-sub">• Global edge locations for fast loading</text>
  <text x="510" y="309" font-size="10" class="dg-sub">• Instant rollbacks • Version history</text>
  <text x="500" y="345" text-anchor="middle" font-size="11" class="dg-label">Total time: ~2 minutes from commit to live • Fully automated • Zero manual steps</text>
</svg>
