<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="400" y="35" text-anchor="middle" font-size="20" class="dg-heading">Serverless Architecture</text>
  <g>
    <rect x="30" y="140" width="100" height="70" rx="8" class="dg-node" />
    <text x="80" y="180" text-anchor="middle" font-size="15" class="dg-title">User</text>
  </g>
  <path d="M 130 175 L 200 175" marker-end="url(#arrow-accent)" class="dg-edge dg-edge--accent" />
  <text x="165" y="165" text-anchor="middle" font-size="11" class="dg-glabel">HTTPS</text>
  <g>
    <rect x="200" y="140" width="150" height="70" rx="8" class="dg-node dg-node--accent" />
    <text x="275" y="172" text-anchor="middle" font-size="15" class="dg-title dg-title--accent">Firebase</text>
    <text x="275" y="192" text-anchor="middle" font-size="12" class="dg-sub">Hosting + CDN</text>
  </g>
  <path d="M 350 175 L 420 120" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 350 175 L 420 210" marker-end="url(#arrow)" class="dg-edge" />
  <g>
    <rect x="420" y="90" width="125" height="60" rx="8" class="dg-node" />
    <text x="482" y="118" text-anchor="middle" font-size="13" class="dg-title">Cloud</text>
    <text x="482" y="136" text-anchor="middle" font-size="13" class="dg-title">Functions</text>
  </g>
  <g>
    <rect x="420" y="180" width="125" height="60" rx="8" class="dg-node" />
    <text x="482" y="215" text-anchor="middle" font-size="13" class="dg-title">Firestore</text>
  </g>
  <path d="M 545 120 L 615 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 545 210 L 615 185" marker-end="url(#arrow)" class="dg-edge" />
  <g>
    <rect x="615" y="135" width="125" height="70" rx="8" class="dg-node" />
    <text x="677" y="165" text-anchor="middle" font-size="13" class="dg-title">BigQuery</text>
    <text x="677" y="185" text-anchor="middle" font-size="11" class="dg-sub">Analytics</text>
  </g>
  <g>
    <rect x="200" y="250" width="150" height="50" rx="8" class="dg-node" />
    <text x="275" y="272" text-anchor="middle" font-size="12" class="dg-title">OpenTelemetry</text>
    <text x="275" y="288" text-anchor="middle" font-size="10" class="dg-sub">SDK (Client)</text>
  </g>
  <path d="M 350 275 L 677 275 L 677 215" stroke-dasharray="5,5" marker-end="url(#arrow)" class="dg-edge" />
  <text x="480" y="265" text-anchor="middle" font-size="10" class="dg-glabel">Traces/Metrics</text>
  <path d="M 275 210 L 275 250" stroke-dasharray="3,3" class="dg-edge" />
  <text x="400" y="330" text-anchor="middle" font-size="12" class="dg-label">Zero server management • Auto-scaling • Global CDN • Full observability</text>
</svg>
