<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead" />
    </marker>
    <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 9 3.5, 0 7" class="dg-arrowhead dg-arrowhead--accent" />
    </marker>
  </defs>
  <text x="600" y="35" text-anchor="middle" font-size="22" class="dg-heading">GitOps Deployment Flow</text>
  <g>
    <rect x="50" y="120" width="120" height="70" rx="8" class="dg-node" />
    <text x="110" y="145" text-anchor="middle" font-size="12" class="dg-title">Developer</text>
    <text x="110" y="163" text-anchor="middle" font-size="9" class="dg-sub">git push</text>
  </g>
  <g>
    <rect x="220" y="120" width="140" height="70" rx="8" class="dg-node" />
    <text x="290" y="145" text-anchor="middle" font-size="12" class="dg-title">GitHub</text>
    <text x="290" y="163" text-anchor="middle" font-size="9" class="dg-sub">GitOps Repo</text>
  </g>
  <g>
    <rect x="410" y="120" width="140" height="70" rx="8" class="dg-node" />
    <text x="480" y="140" text-anchor="middle" font-size="11" class="dg-title">GitHub</text>
    <text x="480" y="155" text-anchor="middle" font-size="11" class="dg-title">Actions</text>
    <text x="480" y="173" text-anchor="middle" font-size="9" class="dg-sub">Build &amp; Test</text>
  </g>
  <g>
    <rect x="600" y="120" width="140" height="70" rx="8" class="dg-node" />
    <text x="670" y="145" text-anchor="middle" font-size="12" class="dg-title">Docker Hub</text>
    <text x="670" y="163" text-anchor="middle" font-size="9" class="dg-sub">Image Registry</text>
  </g>
  <g>
    <rect x="290" y="250" width="160" height="80" rx="8" class="dg-node dg-node--accent" />
    <text x="370" y="280" text-anchor="middle" font-size="13" class="dg-title dg-title--accent">FluxCD</text>
    <text x="370" y="300" text-anchor="middle" font-size="9" class="dg-sub">Source Controller</text>
    <text x="370" y="315" text-anchor="middle" font-size="9" class="dg-sub">Kustomize Controller</text>
  </g>
  <g>
    <rect x="500" y="250" width="160" height="80" rx="8" class="dg-node" />
    <text x="580" y="280" text-anchor="middle" font-size="13" class="dg-title">K3s Cluster</text>
    <text x="580" y="300" text-anchor="middle" font-size="9" class="dg-sub">Apply Manifests</text>
    <text x="580" y="315" text-anchor="middle" font-size="9" class="dg-sub">Update Resources</text>
  </g>
  <g>
    <rect x="710" y="250" width="160" height="80" rx="8" class="dg-node" />
    <text x="790" y="275" text-anchor="middle" font-size="12" class="dg-title">Running Pods</text>
    <text x="790" y="295" text-anchor="middle" font-size="9" class="dg-sub">Blog (Bun.js)</text>
    <text x="790" y="310" text-anchor="middle" font-size="9" class="dg-sub">PostgreSQL</text>
    <text x="790" y="325" text-anchor="middle" font-size="9" class="dg-sub">Ollama LLM</text>
  </g>
  <rect x="920" y="250" width="240" height="80" rx="8" class="dg-node" />
  <text x="1040" y="275" text-anchor="middle" font-size="12" class="dg-title">Monitoring</text>
  <text x="1040" y="295" text-anchor="middle" font-size="9" class="dg-sub">Prometheus metrics</text>
  <text x="1040" y="310" text-anchor="middle" font-size="9" class="dg-sub">Grafana dashboards</text>
  <text x="1040" y="325" text-anchor="middle" font-size="9" class="dg-sub">Loki log aggregation</text>
  <rect x="50" y="400" width="220" height="140" rx="8" class="dg-group" />
  <text x="160" y="425" text-anchor="middle" font-size="12" class="dg-glabel">1. Code Change</text>
  <text x="60" y="445" font-size="9" class="dg-sub">• Developer commits code</text>
  <text x="60" y="465" font-size="9" class="dg-sub">• Push to main branch</text>
  <text x="60" y="485" font-size="9" class="dg-sub">• GitHub webhook triggers</text>
  <text x="60" y="505" font-size="9" class="dg-sub">• CI/CD pipeline starts</text>
  <text x="60" y="525" font-size="9" class="dg-sub">• Build Docker image</text>
  <rect x="300" y="400" width="220" height="140" rx="8" class="dg-group" />
  <text x="410" y="425" text-anchor="middle" font-size="12" class="dg-glabel">2. FluxCD Sync</text>
  <text x="310" y="445" font-size="9" class="dg-sub">• Poll GitHub repo (1min)</text>
  <text x="310" y="465" font-size="9" class="dg-sub">• Detect manifest changes</text>
  <text x="310" y="485" font-size="9" class="dg-sub">• Pull new image tags</text>
  <text x="310" y="505" font-size="9" class="dg-sub">• Validate K8s manifests</text>
  <text x="310" y="525" font-size="9" class="dg-sub">• Apply to cluster</text>
  <rect x="550" y="400" width="220" height="140" rx="8" class="dg-group" />
  <text x="660" y="425" text-anchor="middle" font-size="12" class="dg-glabel">3. Deployment</text>
  <text x="560" y="445" font-size="9" class="dg-sub">• Rolling update strategy</text>
  <text x="560" y="465" font-size="9" class="dg-sub">• Pull new container image</text>
  <text x="560" y="485" font-size="9" class="dg-sub">• Terminate old pods</text>
  <text x="560" y="505" font-size="9" class="dg-sub">• Start new pods</text>
  <text x="560" y="525" font-size="9" class="dg-sub">• Health checks pass</text>
  <rect x="800" y="400" width="220" height="140" rx="8" class="dg-group" />
  <text x="910" y="425" text-anchor="middle" font-size="12" class="dg-glabel">4. Verification</text>
  <text x="810" y="445" font-size="9" class="dg-sub">• Prometheus scrapes metrics</text>
  <text x="810" y="465" font-size="9" class="dg-sub">• Loki ingests logs</text>
  <text x="810" y="485" font-size="9" class="dg-sub">• Grafana dashboards update</text>
  <text x="810" y="505" font-size="9" class="dg-sub">• Alert on failures</text>
  <text x="810" y="525" font-size="9" class="dg-sub">• Traffic routing verified</text>
  <path d="M 170 155 L 220 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 360 155 L 410 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 550 155 L 600 155" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 290 190 L 290 220 L 370 220 L 370 250" stroke-dasharray="5,5" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 670 190 L 670 220 L 580 220 L 580 250" stroke-dasharray="3,3" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 450 290 L 500 290" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 660 290 L 710 290" marker-end="url(#arrow)" class="dg-edge" />
  <path d="M 870 290 L 920 290" stroke-dasharray="3,3" marker-end="url(#arrow)" class="dg-edge" />
  <text x="195" y="145" text-anchor="middle" font-size="8" class="dg-label">commit</text>
  <text x="385" y="145" text-anchor="middle" font-size="8" class="dg-label">trigger</text>
  <text x="575" y="145" text-anchor="middle" font-size="8" class="dg-label">push</text>
  <text x="330" y="210" text-anchor="middle" font-size="8" class="dg-label">reconcile</text>
  <text x="625" y="210" text-anchor="middle" font-size="8" class="dg-label">pull</text>
  <text x="475" y="280" text-anchor="middle" font-size="8" class="dg-label">apply</text>
  <text x="685" y="280" text-anchor="middle" font-size="8" class="dg-label">deploy</text>
  <text x="895" y="280" text-anchor="middle" font-size="8" class="dg-label">observe</text>
  <text x="160" y="570" text-anchor="middle" font-size="10" class="dg-glabel">~2 min</text>
  <text x="410" y="570" text-anchor="middle" font-size="10" class="dg-glabel">~1 min</text>
  <text x="660" y="570" text-anchor="middle" font-size="10" class="dg-glabel">~30 sec</text>
  <text x="910" y="570" text-anchor="middle" font-size="10" class="dg-glabel">continuous</text>
</svg>
