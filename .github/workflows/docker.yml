name: CI & Container Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Verify Standalone App
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build server bundle
        run: bun run build

      - name: Smoke test standalone mode (JSON storage fallback)
        run: |
          PORT=3099 bun run server/index.ts &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:3099/health
          curl -fsS http://localhost:3099/ > /dev/null
          curl -fsS http://localhost:3099/category/open-source > /dev/null
          curl -fsS http://localhost:3099/category/hackathons > /dev/null
          curl -fsS http://localhost:3099/category/engineering > /dev/null
          curl -fsS http://localhost:3099/api/posts/stats > /dev/null
          kill $SERVER_PID || true
